name: Fundamentals weekly

# 每周日北京时间 10:00 (UTC 02:00)：4 个分片并行抓取筛选池（约 1000 只）的最新季度财务指标，再合并进缓存。
# 只抓缺最新季报的股票，财报季过后几乎零开销。也可手动触发。
on:
  workflow_dispatch:
    inputs:
      universe:
        description: "screened（筛选池，约 1000 只）或 all（全市场）"
        default: "screened"
      budget:
        description: "每个分片的秒数上限"
        default: "2700"
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: data/stock_ops.db
          key: stock-ops-db-
          restore-keys: stock-ops-db-
      - run: python scripts/fundamentals_job.py --universe "${{ inputs.universe || 'screened' }}" --shard ${{ matrix.shard }} --shards 4 --budget "${{ inputs.budget || 2700 }}" --out fund/shard${{ matrix.shard }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: fund-shard-${{ matrix.shard }}
          path: fund/
          retention-days: 3

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: daily-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: data/stock_ops.db
          key: stock-ops-db-
          restore-keys: stock-ops-db-
      - uses: actions/download-artifact@v4
        with:
          pattern: fund-shard-*
          path: fund/
      - run: python scripts/fundamentals_job.py --merge fund/ 2>&1 | tee fund.log
      - uses: actions/cache/save@v4
        with:
          path: data/stock_ops.db
          key: stock-ops-db-${{ github.run_id }}
      - name: Post summary as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### Fundamentals weekly $(TZ=Asia/Shanghai date '+%F %R')"; echo; echo '```'; grep -E "INFO|ERROR|WARNING" fund.log | tail -10; echo '```'; } > fund.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@fund.md > /dev/null
