name: Fundamentals weekly

# 每周日北京时间 10:00 (UTC 02:00) 更新全市场季度财务指标；也可手动触发。约 20 分钟。
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "本次运行秒数上限"
        default: "3000"
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/stock_ops.db
          key: stock-ops-db-${{ github.run_id }}
          restore-keys: stock-ops-db-
      - run: python scripts/fundamentals_job.py --budget "${{ inputs.budget || 3000 }}" 2>&1 | tee fund.log
      - name: Post summary as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### Fundamentals weekly $(TZ=Asia/Shanghai date '+%F %R')"; echo; echo '```'; grep -E "INFO|ERROR|WARNING" fund.log | tail -15; echo '```'; } > fund.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@fund.md > /dev/null
