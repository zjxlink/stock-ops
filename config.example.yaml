# 复制为 config.yaml 后按需修改。config.yaml 已被 .gitignore 忽略。
data:
  db_path: data/stock_ops.db
  provider_order: [baostock, akshare_tx, akshare_em]   # 历史K线数据源优先级
  request_interval: 0.3                                 # 每次请求后的休眠秒数
  max_retries: 3

screen:
  fundamental:
    pe_ttm_max: 40
    pe_ttm_min: 0
    pb_max: 8
    total_mv_min: 5.0e+9      # 总市值下限（元）
    turnover_min: 0.5         # 换手率下限（%）
    exclude_st: true
    min_listed_days: 250
  technical:
    ma_fast: 5
    ma_mid: 20
    ma_slow: 60
    rsi_period: 14
    rsi_max: 75
    volume_ratio_min: 1.2
    lookback_days: 120

plan:
  capital: 100000           # 用于计算建议买入股数的总资金（元）
  position_pct: 0.2         # 单只股票仓位上限（占总资金比例）
  trailing_from:    # 移动止损高点起算日：老仓位从这天开始记最高收盘，留空则自买入日起算
  rules: {}                 # 按股票覆盖，例如 {"300458": {mode: hold, note: 长期持有}} 或 {"000550": {trailing_stop: 0.1}}

backtest:
  strategy: ma_bull         # 可选: ma_bull / golden_cross / macd / breakout20 / score
  start: "2019-01-01"
  initial_cash: 100000
  commission: 0.0003        # 佣金率（双边）
  min_commission: 5         # 最低佣金（元）
  stamp_duty: 0.0005        # 卖出印花税
  slippage: 0.001           # 单边滑点
  stop_loss:                # 成本止损，如 0.08 = 收盘低于成本 8% 次日卖出；留空不启用
  trailing_stop: 0.15       # 移动止损，收盘自持仓期间最高收盘回撤 15% 次日卖出；留空不启用
  take_profit:              # 止盈，如 0.3；留空不启用

watchlist:
  - "600519"   # 贵州茅台
  - "000858"   # 五粮液
  - "300750"   # 宁德时代
