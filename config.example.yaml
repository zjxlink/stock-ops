# 复制为 config.yaml 后按需修改。config.yaml 已被 .gitignore 忽略。
data:
  db_path: data/stock_ops.db
  provider_order: [baostock, akshare_tx, akshare_em]   # 历史K线数据源优先级
  request_interval: 0.3                                 # 每次请求后的休眠秒数
  max_retries: 3
  fundamentals_max_age_days: 7   # 基本面缓存超过几天重新抓取

screen:
  fundamental:
    pe_ttm_max: 30
    pe_ttm_min: 0
    pb_max: 8
    total_mv_min: 5.0e+9      # 总市值下限（元）
    turnover_min: 0.5         # 换手率下限（%）
    exclude_st: true
    min_listed_days: 250
    roe_min: 10               # ROE 下限（%），财报缺失的不剔除
    yoy_ni_min: 10            # 本期净利润同比下限（%）
    yoy_ni_prev_min: 0        # 上一期净利润同比下限（%），与本期一起构成连续增长
    liability_to_asset_max: 60   # 资产负债率上限（%）
    growth_cap: 50            # 评分时增速封顶（%），避免周期反转的爆发式数字占优
  technical:
    ma_fast: 5
    ma_mid: 20
    ma_slow: 60
    rsi_period: 14
    rsi_max: 75
    volume_ratio_min: 1.2
    lookback_days: 120

plan:
  capital: 100000           # 用于计算建议买入股数的总资金（元）
  position_pct: 0.2         # 单只股票仓位上限（占总资金比例）
  trailing_from:    # 移动止损高点起算日：老仓位从这天开始记最高收盘，留空则自买入日起算
  rules: {}                 # 按股票覆盖，例如 {"300458": {mode: hold, note: 长期持有}} 或 {"000550": {trailing_stop: 0.1}}

market:
  index: "sh.000300"        # 大盘过滤用的指数（baostock 代码）
  ma: 60                    # 指数收盘低于该均线时不开新仓；设 0 关闭过滤

predict:
  path: data/predictions.csv
  window: 60                # 准确率统计窗口（最近 N 条已验证预测）
  min_n: 40                 # 低于此样本数不判定显著
  backfill_days: 250        # 首次运行回填的历史天数（标记为回填，与真实前瞻区分）

backtest:
  strategy: donchian        # 可选: ma_bull / golden_cross / macd / breakout20 / score / trend60 / donchian
  start: "2019-01-01"
  initial_cash: 100000
  commission: 0.0003        # 佣金率（双边）
  min_commission: 5         # 最低佣金（元）
  stamp_duty: 0.0005        # 卖出印花税
  slippage: 0.001           # 单边滑点
  stop_loss:                # 成本止损，如 0.08 = 收盘低于成本 8% 次日卖出；留空不启用
  trailing_stop:            # 百分比跟踪止损，如 0.15；留空不启用（默认用 ATR 跟踪止损）
  atr_stop: 2.0             # ATR 跟踪止损：止损线 = 持仓期间最高收盘 - 2 倍 ATR，只升不降；留空不启用
  min_hold_days: 5          # 最少持仓天数内忽略信号出场（止损仍有效）
  cooldown_days: 10         # 止损出局后冷却天数内不重新进场
  max_positions: 3          # 组合回测：最多同时持有几只
  take_profit:              # 止盈，如 0.3；留空不启用

watchlist:
  - "600519"   # 贵州茅台
  - "000858"   # 五粮液
  - "300750"   # 宁德时代
