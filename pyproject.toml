[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-ops"
version = "0.1.0"
description = "个人 A 股分析操作系统：数据缓存、基本面筛选、技术面信号、持仓管理"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "akshare>=1.15",
    "baostock>=0.9",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
stock-ops = "stock_ops.cli:app"

[tool.setuptools.packages.find]
include = ["stock_ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "E501"]  # B008: typer 惯用法；RUF00x: 中文标点
